# Sunday model tuning (moved off Dylan's laptop 2026-11-23 so it runs with the laptop off).
# Scores last week's games, lets calibrate.py re-tune each sport's home edge, source weights and rating stretch
# (Dylan approved the automatic weekly tuning 2026-11-08), and commits only the settings calibrate.py writes plus a
# public-safe list of what changed (reports/model_changes.md). The full review, with the private Best spots record and
# Research Assistant scorecard, is NOT published: the cloud weekly-email routine (refresh_weekly_cloud.md) re-runs
# weekly_review.py in its own sandbox at 11 AM ET and emails it to Dylan.
name: Weekly tuning

on:
  schedule:
    - cron: '0 13 * * 0'     # Sunday 13:00 UTC = 8 AM ET in winter, 9 AM in summer (GitHub may start it up to ~1 h late; the email is at 11)
  workflow_dispatch:
    inputs:
      calibrate:
        description: 'Tune the model (only on the real Sunday run; a test run should say false)'
        default: 'false'

permissions:
  contents: write

concurrency:
  group: build               # one writer at a time with the hourly site build
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/New_York
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      # read (never save) the hourly build's downloaded-data cache: final scores in results_*.csv and the rest. Saving a
      # partial copy here would become the newest 'data-' cache and make the next build re-download everything.
      - uses: actions/cache/restore@v4
        with:
          path: |
            cfbv_*.csv
            nflv_*.csv
            cbbv_*.csv
            cbb_ap_*.csv
            p4_*.csv
            p4_*.html
            nfl_*.csv
            nfl_*.html
            cbb_teamrankings_*.html
            nbav_*.csv
            nbav_*.txt
            nba_*.html
            news_cache_*.json
            nhl_*.csv
            nhl_*.html
            epl_*.csv
            cbb_haslametrics_*.xml
            golf_*.json
            golf_pretourney.csv
            mlb_*.csv
            mlb_*.json
            mlb_*.html
            results_*.csv
            crowd_*.csv
            logos
          key: data-none
          restore-keys: data-

      - name: Review and tune
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.calibrate }}" = "true" ]; then
            python weekly_review.py --calibrate > /tmp/review.log 2>&1 || echo "REVIEW FAILED" >> /tmp/review.log
          else
            python weekly_review.py > /tmp/review.log 2>&1 || echo "REVIEW FAILED" >> /tmp/review.log
          fi
          grep -E "Traceback|REVIEW FAILED|  ! " /tmp/review.log || true
          mkdir -p reports
          {
            echo "Date: $(date '+%Y-%m-%d %H:%M') ET"
            if grep -q "REVIEW FAILED" /tmp/review.log; then echo "Status: failed (see the Weekly tuning run in GitHub Actions)"; else echo "Status: ok"; fi
            echo "Tuned: ${{ github.event_name == 'schedule' || github.event.inputs.calibrate == 'true' }}"
            echo ""
            sed -n '/^Model changes this week/,/^$/p' last_review.md 2>/dev/null || true
          } > reports/model_changes.md
          # golf vs Kalshi needs ESPN / Kalshi, which the cloud email run can't reach: save that (public) section here
          { echo "Date: $(date '+%Y-%m-%d %H:%M') ET"; echo ""; sed -n '/^GOLF/,/^$/p' last_review.md 2>/dev/null; } > reports/golf_review.md
          cat reports/model_changes.md

      - name: Commit the tuned settings
        run: |
          git config user.name "alphapoint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/model_changes.md reports/golf_review.md
          for f in calibration.json calibration_log.csv live_kill.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || (git commit -m "Weekly calibration" && (git pull --rebase || (git rebase --abort; false)) && git push)
