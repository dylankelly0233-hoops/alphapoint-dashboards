# Rebuild the AlphaPoint dashboards and publish them to GitHub Pages.
# Runs every hour from 7 AM to 1 AM ET, started by an outside timer (a cron-job.org job, set up
# 2026-11-11, that calls the workflow_dispatch API at :17 with a fine-grained token limited to Actions
# on this repository; the token expires about Nov 2027 and needs renewing). Also runs whenever Claude's
# daily run pushes a new Injury Wire or Research Assistant file, and on demand (Actions tab → "Build dashboards" → Run
# workflow). The cron below is a backup only: GitHub's free scheduler runs it about 3-4 times a day.
name: Build dashboards

on:
  schedule:
    - cron: '17 0-4,12-23 * * *'   # UTC; asks for :17 past every hour, 7-8 AM to 11 PM-midnight ET (best-effort)
  push:
    branches: [main]
    paths: ['*.py', 'injury_wire_*.json', 'gap_notes_*.json', 'cbb_torvik_*.csv', 'calibration.json', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write      # commit the line history and rating history back to the repo
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: America/New_York            # "today", kickoff weeks and "Updated" times are Eastern
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      # Always build from the latest main (not the commit that triggered the run), so overlapping runs
      # don't start from an older copy of the history files.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # Downloaded data (box scores, play-by-play, ratings pages, logos) carries over between runs,
      # so each run only re-fetches what has gone stale — this keeps API usage low.
      - uses: actions/cache@v4
        with:
          path: |
            cfbv_*.csv
            nflv_*.csv
            cbbv_*.csv
            cbb_ap_*.csv
            p4_*.csv
            p4_*.html
            nfl_*.csv
            nfl_*.html
            cbb_teamrankings_*.html
            nbav_*.csv
            nbav_*.txt
            nba_*.html
            news_cache_*.json
            nhl_*.csv
            nhl_*.html
            epl_*.csv
            cbb_haslametrics_*.xml
            golf_*.json
            golf_pretourney.csv
            mlb_*.csv
            mlb_*.json
            mlb_*.html
            results_*.csv
            crowd_*.csv
            logos
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Build dashboards
        run: python build_site.py

      # If another build saved its history first, this save can conflict. Don't let that block publishing:
      # the snapshot is simply recorded again on the next run.
      - name: Save line history and rating history
        continue-on-error: true
        run: |
          git config user.name "alphapoint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add line_history_*.csv ratings_history_*.csv projections_*.csv source_history_*.csv golf_log_*.csv totals_first_*.json best_spots_log.csv cbb_prior_*.json nba_prior_*.json
          git diff --cached --quiet || (git commit -m "Update line and rating history [skip ci]" && (git pull --rebase || (git rebase --abort; false)) && git push)

      # The cloud Research Assistant / Injury Wire runs (Claude routines, 2026-11-21) can't run the dashboards,
      # so publish this build's inputs for them on the 'data' branch: one commit, replaced each build (no history).
      - name: Publish research inputs to the data branch
        continue-on-error: true
        run: |
          mkdir -p /tmp/data && cp injury_candidates_*.json gap_candidates_*.json results_*.csv /tmp/data/ 2>/dev/null || true
          # health reports for the cloud daily digest (refresh_digest_cloud.md); final scores for the cloud weekly email
          python -c "import model_performance as m; l, w = m.health_lines(); print('MODEL HEALTH'); [print('  ' + x) for x in l]; print('Warnings:' if w else 'Warnings: none'); [print('  ! ' + x) for x in w]" > /tmp/data/model_health.txt 2>&1 || true
          python gap_health.py > /tmp/data/gap_health.txt 2>&1 || true
          date -Iseconds > /tmp/data/BUILT_AT.txt
          cd /tmp/data && git init -q -b data && git add -A
          git -c user.name="alphapoint-bot" -c user.email="actions@users.noreply.github.com" commit -qm "Research inputs [skip ci]"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data:data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub sometimes can't see a just-uploaded artifact yet ("No artifacts named github-pages", 2026-11-20): wait a bit
      - run: sleep 20
      - id: deploy
        uses: actions/deploy-pages@v4
